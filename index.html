<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Music</title>
<style>
:root{--b1:#4b5567;--b2:#434c5c;--b3:#3a4250;--wh1:#1b1e23;--wh2:#101216;--ce:#16181d;--wi:#ececf1;--acc:#fff;--accRGB:255,255,255;--R:47px;--m:12px}
@font-face{font-family:Quicksand;src:url(Quicksand-Medium.ttf) format('truetype');font-weight:400 600;font-display:swap}
@font-face{font-family:Quicksand;src:url(Quicksand-Bold.ttf) format('truetype');font-weight:700 900;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--b3);overflow:hidden;overscroll-behavior:none;font-family:Quicksand,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;color:#fff}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit}
/* device: fullscreen on phones, concentric corners (screen radius = device radius - inset) */
.dv{--w:100vw;position:fixed;inset:0;font-size:calc(var(--w)/28);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + var(--m)) var(--m) max(env(safe-area-inset-bottom,0px),var(--m));
  background:linear-gradient(180deg,var(--b1),var(--b2) 50%,var(--b3));corner-shape:squircle}
@media (min-width:700px){.dv{--w:min(420px,52dvh);position:relative;inset:auto;width:var(--w);height:min(92dvh,calc(var(--w)*1.85));padding:var(--m);border-radius:var(--R);box-shadow:inset 0 .06em 0 #ffffff26,0 2em 5em #0009}}
.screen{position:relative;flex:1;min-height:0;border-radius:calc(var(--R) - var(--m));overflow:hidden;container-type:size;background:#000;corner-shape:squircle}
.bg{position:absolute;inset:0;transition:background .7s}
#view{position:absolute;inset:0}
#toast{opacity:0;transition:opacity .2s;position:absolute;left:10%;right:10%;bottom:6%;text-align:center;font-size:1.05em;padding:.6em;border-radius:1em;background:#000b;display:none;z-index:9}
/* lists */
.rows{flex:1;min-height:0;overflow:hidden;padding-bottom:1em}
.list{position:absolute;inset:0;padding-top:.9em;display:flex;flex-direction:column}
.hd{padding:.1em 1.6em .55em;font-size:1.7em;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;line-height:1.15}
.hd small{font-size:.5em;font-weight:500;opacity:.5}
.row{display:flex;align-items:center;gap:.9em;margin:0 calc(.9em - 1px);padding:0 .9em;border-radius:calc(var(--R) - var(--m) - .9em);flex:none;corner-shape:squircle}
.row.sel{background:rgba(var(--accRGB),.2)}
.th{width:2.4em;height:2.4em;border-radius:.45em;background:#ffffff1c center/cover;flex:none}
.sw{width:1.5em;height:1.5em;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .1em #ffffff4d}
.tx{min-width:0;flex:1}
.tx b{display:block;font-weight:600;font-size:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx i{display:block;font-style:normal;font-size:.95em;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;opacity:.55;font-size:1em}.row .ch{opacity:.4;font-size:1.3em}.row .ck{font-size:1.2em}
.empty{position:absolute;inset:4em 0 0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5em;opacity:.7;font-size:1.15em;line-height:1.6}
/* now playing */
.np{position:absolute;inset:0;padding:1.5em 2em 2.1em;display:flex;flex-direction:column}
.hero{flex:1;min-height:0;display:flex;align-items:center;gap:1.3em}
.art{height:100%;max-height:100%;aspect-ratio:1;flex:none;background:#ffffff14 center/cover;display:flex;align-items:center;justify-content:center;font-size:4em;color:#fff5;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent),linear-gradient(180deg,#000 62%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,#000 55%,transparent),linear-gradient(180deg,#000 62%,transparent);mask-composite:intersect}
.t{min-width:0;flex:1}
.t h2{margin:0;font-size:1.65em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.t p{margin:.1em 0 0;font-size:1.25em;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}.t p.d{opacity:.4}
@container (aspect-ratio < 1.05){
 .hero{flex-direction:column;align-items:stretch;gap:.7em}
 .art{flex:1;min-height:0;height:auto;align-self:center;max-width:100%;border-radius:1.1em;-webkit-mask-image:radial-gradient(farthest-side at 50% 45%,#000 66%,transparent 100%);mask-image:radial-gradient(farthest-side at 50% 45%,#000 66%,transparent 100%);-webkit-mask-composite:source-over;mask-composite:add}
 .t{flex:none}
}
.r1,.r3{display:flex;justify-content:space-between;align-items:center;min-height:2.6em}
.fmt{font-size:1.3em;font-weight:600;opacity:.75}.fmt span{font-weight:500;opacity:.7}
.dev{display:flex;align-items:center;gap:.7em;font-size:1.1em;font-weight:500;opacity:.8}
.acts{display:flex;gap:.6em}.acts span{display:block;padding:.35em}
.ic{width:1.6em;height:1.6em;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.dev .ic{width:1.3em;height:1.3em}
.tms{display:flex;justify-content:space-between;font-size:1.05em;opacity:.6;font-variant-numeric:tabular-nums}
.barw{padding:.6em 0}
.bar{height:.34em;border-radius:.3em;background:#ffffff33;transition:height .15s}
.bar b{display:block;height:100%;border-radius:.3em;background:var(--acc)}
.bar.sc{height:.65em}
/* wheel */
.wheelbox{flex:none;display:flex;align-items:center;justify-content:center;padding:calc(var(--m)*1.5) 0 calc(var(--m)*.8)}
.wheel{position:relative;width:min(calc(var(--w)*.76),37dvh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 28%,var(--wh1),var(--wh2) 82%);box-shadow:inset 0 0 0 .06em #ffffff0d,0 .15em .7em #0005;touch-action:none}
.wi{position:absolute;stroke:var(--wi);fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none;width:1.4em;height:auto;transition:stroke .12s,transform .12s}
.wi.t{top:6.8%;left:50%;margin-left:-.6em;width:1.2em}
.wi.b{bottom:6%;left:50%;margin-left:-.7em}
.wi.le{left:5.2%;top:50%;margin-top:-.5em}
.wi.r{right:5.2%;top:50%;margin-top:-.5em}
.wi.on{stroke:var(--acc);transform:scale(1.18)}
.row .ic{width:1.15em;height:1.15em;stroke-width:2;flex:none}.row .ic.ch{opacity:.4}.row .ic.now{width:1.2em;height:1.2em}
.row.mv{background:rgba(var(--accRGB),.42)}
.dev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:16em}
.qrow{margin:0 .9em;padding:.55em .9em;border-radius:1em;background:#ffffff1f;font-size:1.3em;min-height:2.3em;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.qrow.on{box-shadow:0 0 0 .1em rgba(var(--accRGB),.65)}.qrow i{opacity:.45;font-style:normal}
.strip{display:flex;justify-content:space-around;align-items:center;margin:.35em .9em .3em;font-size:1.45em;font-weight:600;opacity:.55}
.strip.on{opacity:1}.strip span{min-width:1.3em;text-align:center;display:flex;justify-content:center}.strip .cur{background:rgba(var(--accRGB),.3);border-radius:.5em;padding:.02em .35em}
.strip .ic{width:1em;height:1em;stroke-width:2}
.none{text-align:center;opacity:.55;padding:1.2em;font-size:1.15em}
.lyr{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(180deg,transparent,#000 18%,#000 82%,transparent)}
.lyr .in{position:absolute;left:0;right:0;top:0;transition:transform .35s ease}
.ln{padding:.4em 1.6em;font-size:1.55em;font-weight:700;opacity:.3;transition:opacity .3s;line-height:1.25}.ln.on{opacity:1}
#kb{position:fixed;left:-50px;top:0;opacity:.01;width:1px;height:1px;font-size:16px;-webkit-user-select:text;user-select:text;border:0;padding:0}
.cprev{display:flex;align-items:center;gap:.9em;margin:0 1.5em .5em;font-size:1.3em}
.cs{width:2.5em;height:2.5em;border-radius:.9em;box-shadow:inset 0 0 0 .1em #ffffff40}
.crow{margin:.1em .9em;padding:.5em .8em .65em;border-radius:1em}.crow.on{background:rgba(var(--accRGB),.2)}
.cl{display:flex;justify-content:space-between;font-size:1.05em;font-weight:600;margin-bottom:.45em}.cl em{font-style:normal;opacity:.6}
.cb{position:relative;height:.9em;border-radius:.5em;box-shadow:inset 0 0 0 .08em #ffffff30;touch-action:none}
.cb i{position:absolute;top:50%;width:1.3em;height:1.3em;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 .1em .4em #0008}
@keyframes inR{from{opacity:0;transform:translateX(10%)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-10%)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes scU{from{opacity:.55;transform:translateY(.9em)}to{opacity:1;transform:none}}
@keyframes scD{from{opacity:.55;transform:translateY(-.9em)}to{opacity:1;transform:none}}
.row{transition:background .15s ease}
.bar b{transition:width .35s linear}.bar.sc b{transition:none}
.pk{width:1.5em;height:1.5em;border-radius:50%;border:.12em solid #ffffff80;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.pk.on{background:var(--acc);border-color:var(--acc)}.pk .ic{width:.95em;height:.95em;stroke:#000;stroke-width:2.6}
.row .du,.row>em{margin-left:.4em;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:.2em;margin-top:.4em;margin-left:-.2em}.stars span{padding:.15em .1em}.stars .ic{width:1.15em;height:1.15em;stroke-width:1.6}
.dev .ic{flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.center{transition:transform .12s ease,filter .12s}.center:active{transform:translate(-50%,-50%) scale(.95)}
.center{position:absolute;left:50%;top:50%;width:40.4%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--ce);border:0;padding:0;box-shadow:inset 0 0 0 .08em #ffffff12}
.center:active{filter:brightness(1.35)}
</style>

<body>
<div class="dv">
  <div class="screen"><div class="bg" id="bg"></div><div id="view"></div><div id="toast"></div></div>
  <div class="wheelbox"><div class="wheel" id="wheel">
    <svg class="wi t" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    <svg class="wi le" viewBox="0 0 28 20"><path d="M2.5 3v14M14 3.5v13L5.8 10zM25 3.5v13L16.8 10z"/></svg>
    <svg class="wi r" viewBox="0 0 28 20"><path d="M25.5 3v14M14 3.5v13l8.2-6.5zM3 3.5v13l8.2-6.5z"/></svg>
    <svg class="wi b" viewBox="0 0 28 20"><path d="M3 3v14l11-7zM19.5 3v14M24.5 3v14"/></svg>

  </div></div>
</div>
<audio id="a" preload="auto" playsinline></audio>
<input type="file" id="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.alac,.aiff,.caf,.lrc,.txt" hidden>
<input id="kb" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><input type="file" id="rest" accept=".json,application/json" hidden>
<script src="jsmediatags.min.js"></script>
<script>
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const isP=s=>s.type==='np'||s.type==='lyr';
const $=s=>document.querySelector(s),A=$('#a'),view=$('#view'),bg=$('#bg');
let db,tracks=[],queue=[],qi=-1,stack=[],curUrl=null,artUrl=null,thumbs=[],scrub=null,scrubT=0,artColor=null,lastSave=0,pn=0,byId=new Map();
let shuffle=!!LS('shuffle'),repeat=LS('repeat')||0,fav=new Set(LS('fav')||[]);
let STATS=LS('stats')||{},META=LS('meta')||{},LYR=LS('lyr')||{},rate=LS('rate')||1,sleepAt=0,sleepEnd=false,sleepMin=0,counted=false,eq=null,RATE=LS('rt')||{},XM=LS('xm')||{},DUR=LS('dur')||{},durDirty=false,navDir=0;
const dev=/iPhone/.test(navigator.userAgent)?'iPhone':/iPad/.test(navigator.userAgent)?'iPad':/Android/.test(navigator.userAgent)?'This phone':'This device';

/* ---------- theme / customization ---------- */
const DEFT={body:'#434c5c',wheel:'#15171b',icon:'auto',accent:'#ffffff',screen:'art',scol:'#2f6a8c',scroll:18,seek:1,hap:true,snd:false,sort:'title'};
let TH={...DEFT,...(LS('theme')||{})};
const h2r=h=>{h=h.replace('#','');if(h.length==3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const mixc=(c,t,a)=>c.map((v,i)=>Math.round(v+(t[i]-v)*a)),css=c=>`rgb(${c.join(',')})`,lum=c=>(.299*c[0]+.587*c[1]+.114*c[2])/255;
const scrBg=c=>{const m=f=>css(c.map(v=>Math.round(v*f)));return `linear-gradient(165deg,${m(.9)},${m(.55)} 55%,${m(.28)})`};
function paintBg(t=TH){const top=stack[stack.length-1];bg.style.background=scrBg(top&&isP(top)&&t.screen==='art'&&artColor?artColor:h2r(t.scol))}
function applyTheme(t=TH){
  const r=document.documentElement.style,b=h2r(t.body),w=h2r(t.wheel),W=[255,255,255],K=[0,0,0];
  r.setProperty('--b1',css(mixc(b,W,.08)));r.setProperty('--b2',css(b));r.setProperty('--b3',css(mixc(b,K,.16)));
  r.setProperty('--wh1',css(mixc(w,W,.07)));r.setProperty('--wh2',css(mixc(w,K,.28)));r.setProperty('--ce',css(mixc(w,lum(w)>.5?K:W,.035)));
  r.setProperty('--wi',t.icon==='white'?'#fff':t.icon==='black'?'#111':t.icon==='accent'?t.accent:(lum(w)>.55?'#2a2c31':'#ececf1'));
  r.setProperty('--acc',t.accent);r.setProperty('--accRGB',h2r(t.accent).join(','));
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.setAttribute('content',css(b));
  paintBg(t);
}
const setTh=p=>{TH={...TH,...p};LS('theme',TH);applyTheme()};
const preview=p=>applyTheme({...TH,...p});
applyTheme();

const I={
 dl:`<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>`,
 air:`<svg class="ic" viewBox="0 0 24 24"><path d="M6 17H5a3 3 0 01-3-3V7a3 3 0 013-3h14a3 3 0 013 3v7a3 3 0 01-3 3h-1"/><path d="M12 14l5.5 7h-11z"/></svg>`,
 del:`<svg class="ic" viewBox="0 0 24 24"><path d="M21 6H9l-6 6 6 6h12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>`,
 sp:`<svg class="ic" viewBox="0 0 24 24"><path d="M4 11v5h16v-5"/></svg>`,
 chk:`<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
 chev:`<svg class="ic ch" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`,
 mv:`<svg class="ic" viewBox="0 0 24 24"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>`,
 note:`<svg class="ic" viewBox="0 0 24 24" style="width:34%;height:34%;opacity:.45"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>`,
 now:`<svg class="ic now" viewBox="0 0 24 24" style="fill:var(--acc);stroke:none"><rect x="4" y="10" width="3.5" height="10" rx="1.2"/><rect x="10.2" y="4" width="3.5" height="16" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="12" rx="1.2"/></svg>`,
 star:f=>`<svg class="ic" viewBox="0 0 24 24" style="fill:${f?'#fff':'none'}"><path d="M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z"/></svg>`,
 dots:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3"/><circle cx="7.6" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="16.4" cy="12" r=".6"/></svg>`,
 lyr:`<svg class="ic" viewBox="0 0 24 24"><path d="M4 4.5h16v11.5h-9l-4.2 3.8V16H4z"/><path d="M8.5 9h2.2M13.3 9h2.2M8.5 12h2.2M13.3 12h2.2"/></svg>`,
 list:`<svg class="ic" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4 6.5h.1M4 12h.1M4 17.5h.1"/></svg>`,
 phones:`<svg class="ic" viewBox="0 0 24 24"><path d="M4.5 14v-2a7.5 7.5 0 0115 0v2"/><rect x="3.5" y="13.5" width="4" height="6.5" rx="2"/><rect x="16.5" y="13.5" width="4" height="6.5" rx="2"/></svg>`};

/* ---------- feedback ---------- */
let actx;
const HP=(()=>{const w=document.createElement('div');w.setAttribute('aria-hidden','true');w.style.cssText='position:fixed;left:-120px;top:0;width:1px;height:1px;overflow:hidden';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.id='hpsw';i.tabIndex=-1;const l=document.createElement('label');l.htmlFor='hpsw';w.append(i,l);document.body.appendChild(w);return l})();
function haptic(){if(!TH.hap)return;try{if(navigator.vibrate)navigator.vibrate(6);else HP.click()}catch(e){}
  if(TH.snd)try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.frequency.value=2200;g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.0001,n+.012);o.connect(g);g.connect(actx.destination);o.start(n);o.stop(n+.015)}catch(e){}}
let toastT;function toast(t,ms){const m=$('#toast');m.textContent=t;m.style.display='block';requestAnimationFrame(()=>m.style.opacity=1);clearTimeout(toastT);if(ms)toastT=setTimeout(()=>{m.style.opacity=0;setTimeout(()=>{if(m.style.opacity==='0')m.style.display='none'},220)},ms)}
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- storage ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('music',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('t',m);const o=f(t.objectStore('t'));t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error)});
async function load(){tracks=(await tx('readonly',s=>s.getAll()))||[];tracks.forEach(t=>Object.assign(t,XM[t.key]||{},META[t.key]||{}));sortTracks();byId=new Map(tracks.map(t=>[t.key,t]))}
const ID3G=['Blues','Classic Rock','Country','Dance','Disco','Funk','Grunge','Hip-Hop','Jazz','Metal','New Age','Oldies','Other','Pop','R&B','Rap','Reggae','Rock','Techno','Industrial','Alternative','Ska','Death Metal','Pranks','Soundtrack','Euro-Techno','Ambient','Trip-Hop','Vocal','Jazz+Funk','Fusion','Trance','Classical','Instrumental','Acid','House','Game','Sound Clip','Gospel','Noise','Alt Rock','Bass','Soul','Punk','Space','Meditative','Instrumental Pop','Instrumental Rock','Ethnic','Gothic','Darkwave','Techno-Industrial','Electronic','Pop-Folk','Eurodance','Dream','Southern Rock','Comedy','Cult','Gangsta','Top 40','Christian Rap','Pop/Funk','Jungle','Native American','Cabaret','New Wave','Psychedelic','Rave','Showtunes','Trailer','Lo-Fi','Tribal','Acid Punk','Acid Jazz','Polka','Retro','Musical','Rock & Roll','Hard Rock'];
